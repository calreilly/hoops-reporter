<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoops Reporter AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="glow-bg"></div>
    <div class="dashboard-container">
        
        <header class="header">
            <div class="logo">
                <span class="icon">🏀</span>
                <h1>Hoops Oracle <span class="badge">Agentic RAG</span></h1>
            </div>
            <p class="subtitle">AI Sports Desk Powered by MCP & Vector DB</p>
        </header>

        <div class="nav-controls" style="display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem;">
            <button id="openReporterBtn" class="primary-btn shrink-btn" style="margin: 0; max-width: 250px;"><span class="icon">✍️</span> Draft Custom Report</button>
            <button id="backToStoriesBtn" class="tab-btn hidden" style="margin: 0;"><span class="icon">🏠</span> Back to Stories</button>
        </div>

        <main class="main-content hidden" id="reportView">
            <div class="input-panel glass-panel">
                <h2>New Assignment</h2>
                <div class="input-group">
                    <label for="prompt">What should the Reporter cover?</label>
                    <textarea id="prompt" placeholder="e.g. Write a preview for a potential UConn vs Marquette matchup. Include injury updates and the mathematical projection."></textarea>
                </div>
                <button id="generateBtn" class="primary-btn">
                    <span class="btn-text">Generate Report</span>
                    <div class="spinner hidden"></div>
                </button>
            </div>

            <div class="output-panel glass-panel">
                <div class="panel-header">
                    <h2>Generated Report</h2>
                    <div class="trust-badge hidden" id="trustBadge" title="LLM-as-a-Judge Audit">
                        <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                        <span id="trustScoreText">Factuality: --%</span>
                    </div>
                </div>
                <div class="report-content" id="reportContainer">
                    <div class="status-indicator">
                        <span class="dot" id="statusDot"></span>
                        <span id="statusText">Awaiting Request</span>
                    </div>
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        <p>Feed is empty. Submit an assignment to begin.</p>
                    </div>
                </div>
            </div>
        </main>

        </main>

        <main class="single-column" id="hotStoriesView">
            <div class="output-panel glass-panel" style="width: 100%;">
                <div class="panel-header">
                    <h2>Live Hot Stories Feed</h2>
                    <button class="primary-btn shrink-btn" id="refreshFeedBtn">Refresh Feed</button>
                </div>
                <div class="report-content" id="hotStoriesContainer">
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8l-4 4v16a2 2 0 0 0 2 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        <p>Click Refresh to fetch the latest stories instantly.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
